<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Parfums & Accessoires</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind (CDN build, no bundler required) -->
  <script src="https://cdn.tailwindcss.com/3.4.14"></script>

  <!-- React 18 + Babel standalone (JSX compiled in-browser; swap for a Vite build in production) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>

  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      background: var(--tg-theme-bg-color, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: none;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-1 {
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Apply Telegram theme params as CSS variables as early as possible,
    // and keep them in sync if the user switches theme inside Telegram.
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;

      function applyTheme() {
        var params = tg.themeParams || {};
        var root = document.documentElement;
        Object.keys(params).forEach(function (key) {
          var cssVar = "--tg-theme-" + key.replace(/_/g, "-");
          root.style.setProperty(cssVar, params[key]);
        });
        root.style.setProperty("--tg-color-scheme", tg.colorScheme || "light");
      }

      applyTheme();
      tg.onEvent("themeChanged", applyTheme);
      tg.ready();
    })();
  </script>

  <script type="text/babel" data-presets="react" src="src/data/products.js"></script>
  <script type="text/babel" data-presets="react" src="src/app.jsx"></script>
</body>
</html>

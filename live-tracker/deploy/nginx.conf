# /etc/nginx/sites-available/live-tracker   (remplacer suivi.exemple.fr ; certificat : certbot --nginx -d suivi.exemple.fr)
server {
    listen 80;
    server_name suivi.exemple.fr;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE : pas de buffering, connexion longue
    location /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # l'ingestion est protégée par jeton ; on limite en plus le débit
    location /api/position {
        limit_req zone=tracker burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
# à placer dans le contexte http {} (ex. /etc/nginx/conf.d/tracker-limit.conf) :
